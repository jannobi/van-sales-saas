<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vyapar Global Van Sales & Distribution SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 font-sans select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Translation dictionary for dynamic multi-language support
    const translations = {

        mode: "মোড",

        salesBilling: "মাল্টি-ইউনিট বিলিং ও থার্মাল মেমো",
        selectCustomer: "-- কাস্টমার সিলেক্ট করুন --",
        product: "প্রোডাক্ট",
        qty: "পরিমাণ",
        addToCart: "কার্টে যোগ করুন",
        printThermal: "🖨️ ব্লুটুথ থার্মাল প্রিন্ট করুন",
        companyPanel: "🏢 কোম্পানি অ্যাডমিন প্যানেল (ম্যানেজমেন্ট)",
        companyDesc: "সেলসম্যান নিয়োগ, রুট শিডিউল এবং গোডাউন থেকে ভ্যানে স্টক ট্রান্সফার।",
        addSalesman: "➕ নতুন সেলসম্যান ও রুট অ্যাসাইন করুন",
        sNamePlaceholder: "সেলসম্যানের নাম",
        sPhonePlaceholder: "মোবাইল নম্বর",
        sRoutePlaceholder: "অ্যাসাইন রুট (যেমন: উত্তরা রুট - বি)",
        saveSalesman: "সেলসম্যান সংরক্ষণ করুন",
        salesmanList: "👥 কোম্পানির সেলসম্যান তালিকা",
        stockMonitor: "📦 গোডাউন ও ভ্যান স্টক লাইভ মনিটরিং",
        mainGodown: "মূল গোডাউন",
        superPanel: "👑 সুপার অ্যাডমিন প্যানেল",
        superDesc: "প্যাকেজ ও ডিভাইস কন্ট্রোল।",
        deviceList: "🛡️ সংযুক্ত ডিভাইস লিস্ট",
        block: "ব্লক",
        dashboard: "ড্যাশবোর্ড",
        salesTab: "সেলস ও বিলিং",
        pinTitle: "নিরাপত্তা পিন কোড দিন",
        pinHint: "কোম্পানি পিন: 2234 | সুপার পিন: 1123",
        cancel: "বাতিল",
        enter: "প্রবেশ",
        wrongPin: "ভুল সিকিউরিটি পিন!"
      },
      en: {
        appName: "Vyapar Global Van Sales",
        mode: "Mode",
        salesman: "Salesman",
        company: "Company",
        super: "Super",
        panelSwitch: "Panel Switch:",
        receivable: "Total Receivable",
        vanStock: "Van Stock Items",
        salesBilling: "Multi-Unit Billing & Thermal Memo",
        selectCustomer: "-- Select Customer --",
        product: "Product",
        qty: "Quantity",
        addToCart: "Add to Cart",
        printThermal: "🖨️ Print Thermal Receipt",
        companyPanel: "🏢 Company Admin Panel (Management)",
        companyDesc: "Salesman recruitment, route scheduling, and van stock transfer.",
        addSalesman: "➕ Add Salesman & Assign Route",
        sNamePlaceholder: "Salesman Name",
        sPhonePlaceholder: "Mobile Number",
        sRoutePlaceholder: "Assign Route (e.g., Uttara Route - B)",
        saveSalesman: "Save Salesman",
        salesmanList: "👥 Company Salesmen List",
        stockMonitor: "📦 Godown & Van Stock Live Monitoring",
        mainGodown: "Main Godown",
        superPanel: "👑 Super Admin Panel",
        superDesc: "Package & Device Control.",
        deviceList: "🛡️ Connected Device List",
        block: "Block",
        dashboard: "Dashboard",
        salesTab: "Sales & Billing",
        pinTitle: "Enter Security PIN Code",
        pinHint: "Company PIN: 2234 | Super PIN: 1123",
        cancel: "Cancel",
        enter: "Enter",
        wrongPin: "Wrong Security PIN!"
      },
      ar: {
        appName: "فيابار مبيعات الشاحنات العالمية",
        mode: "الوضع",
        salesman: "مندوب مبيعات",
        company: "الشركة",
        super: "مشرف عام",
        panelSwitch: "تبديل اللوحة:",
        receivable: "إجمالي المستحقات",
        vanStock: "عناصر مخزون الشاحنة",
        salesBilling: "فواتير وحدات متعددة وإيصال حراري",
        selectCustomer: "-- اختر العميل --",
        product: "المنتج",
        qty: "الكمية",
        addToCart: "أضف إلى السلة",
        printThermal: "🖨️ طباعة الإيصال الحراري",
        companyPanel: "🏢 لوحة تحكم الشركة (الإدارة)",
        companyDesc: "تعيين مندوبي المبيعات وجدولة المسارات ونقل المخزون.",
        addSalesman: "➕ إضافة مندوب مبيعات وتعيين المسار",
        sNamePlaceholder: "اسم مندوب المبيعات",
        sPhonePlaceholder: "رقم الجوال",
        sRoutePlaceholder: "تعيين المسار",
        saveSalesman: "حفظ مندوب المبيعات",
        salesmanList: "👥 قائمة مندوبي الشركة",
        stockMonitor: "📦 مراقبة مخزون المستودع والشاحنة",
        mainGodown: "المستودع الرئيسي",
        superPanel: "👑 لوحة تحكم المشرف العام",
        superDesc: "تحكم الحزم والأجهزة.",
        deviceList: "🛡️ قائمة الأجهزة المتصلة",
        block: "حظر",
        dashboard: "لوحة القيادة",
        salesTab: "المبيعات والفواتير",
        pinTitle: "أدخل رمز الأمان PIN",
        pinHint: "رقم الشركة: 2234 | رقم المشرف: 1123",
        cancel: "إلغاء",
        enter: "دخول",
        wrongPin: "رمز الأمان خطأ!"
      }
    };

    function App() {
      // Global Language & Currency Separated
      const [lang, setLang] = useState('bn');
      const [currency, setCurrency] = useState('BDT');

      const t = translations[lang] || translations.bn;

      // Auth & Panels
      const [authRole, setAuthRole] = useState('salesman');
      const [showPinModal, setShowPinModal] = useState(false);
      const [targetRole, setTargetRole] = useState('');
      const [pinInput, setPinInput] = useState('');
      const [activeTab, setActiveTab] = useState('dashboard');

      // Company Admin States
      const [companySalesmen, setCompanySalesmen] = useState([
        { id: 1, name: "রহিম মিয়া", phone: "01911223344", route: "সাভার রুট - এ", status: "Active" }
      ]);
      const [newSName, setNewSName] = useState('');
      const [newSPhone, setNewSPhone] = useState('');
      const [newSRoute, setNewSRoute] = useState('');

      const [companyStock, setCompanyStock] = useState([
        { id: 1, name: "ম্যাংগো জুস", mainGodown: 500, vanStock: 45, salePrice: 1440 },
        { id: 2, name: "এনার্জি ড্রিংকস", mainGodown: 800, vanStock: 120, salePrice: 50 }
      ]);

      const [parties, setParties] = useState([
        { id: 1, name: "ভাই ভাই স্টোর", phone: "01711223344", address: "সাভার বাজার", amount: 1500, creditLimit: 10000 }
      ]);

      const [selectedPartyForSale, setSelectedPartyForSale] = useState('');
      const [salesCart, setSalesCart] = useState([]);
      const [selectedItemId, setSelectedItemId] = useState('');
      const [itemUnitType, setItemUnitType] = useState('Pcs');
      const [itemQty, setItemQty] = useState(1);
      const [globalConnectedDevices, setGlobalConnectedDevices] = useState([
        { id: 101, companyName: "বসুন্ধরা ফুড প্রডাক্টস", deviceName: "Samsung Galaxy A54", ip: "103.85.152.10" }
      ]);

      const languagesList = [
        { code: 'bn', name: 'বাংলা (Bengali)' }, { code: 'en', name: 'English' }, { code: 'ar', name: 'العربية (Arabic)' }
      ];
      const currenciesList = [
        { code: 'BDT', symbol: '৳' }, { code: 'USD', symbol: '$' }, { code: 'SAR', symbol: 'ر.س' }
      ];
      const currentSymbol = currenciesList.find(c => c.code === currency)?.symbol || '৳';

      const requestRoleSwitch = (role) => {
        if (role === 'salesman') {
          setAuthRole('salesman');
          setActiveTab('dashboard');
        } else {
          setTargetRole(role);
          setPinInput('');
          setShowPinModal(true);
        }
      };

      const verifyPinAndSwitch = () => {
        if (targetRole === 'company_admin' && pinInput === '2234') {
          setAuthRole('company_admin');
          setShowPinModal(false);
        } else if (targetRole === 'super_admin' && pinInput === '1123') {
          setAuthRole('super_admin');
          setShowPinModal(false);
        } else {
          alert(t.wrongPin);
          setPinInput('');
        }
      };

      const handlePrintThermalReceipt = async () => {
        if (salesCart.length === 0) {
          alert('No items in cart!');
          return;
        }
        try {
          if (!navigator.bluetooth) {
            alert('Web Bluetooth not supported!');
            return;
          }
          const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']
          });
          await device.gatt.connect();
          alert(`Connected: ${device.name}`);
        } catch (err) {
          console.error(err);
          alert('Printer connection failed.');
        }
      };

      return (
        <div className="min-h-screen flex flex-col max-w-md mx-auto bg-white shadow-2xl relative pb-16">
          {/* Header with Dynamic Multi-Language Selection */}
          <header className="bg-emerald-900 text-white p-2.5 flex justify-between items-center shadow text-xs">
            <div>
              <h1 className="font-bold">{t.appName}</h1>
              <p className="text-[9px] text-emerald-300">{t.mode}: {authRole === 'salesman' ? t.salesman : authRole === 'company_admin' ? t.company : t.super}</p>
            </div>
            <div className="flex gap-1.5 items-center">
              <select value={lang} onChange={(e) => setLang(e.target.value)} className="bg-emerald-950 text-white text-[10px] p-1 rounded font-bold outline-none">
                {languagesList.map(l => <option key={l.code} value={l.code}>{l.name}</option>)}
              </select>
              <select value={currency} onChange={(e) => setCurrency(e.target.value)} className="bg-emerald-950 text-white text-[10px] p-1 rounded font-bold outline-none">
                {currenciesList.map(c => <option key={c.code} value={c.code}>{c.code} ({c.symbol})</option>)}
              </select>
            </div>
          </header>

          {/* Secure Panel Switcher */}
          <div className="bg-slate-900 text-white px-3 py-1.5 flex justify-between items-center text-[11px]">
            <span>{t.panelSwitch}</span>
            <div className="flex gap-1">
              <button onClick={() => requestRoleSwitch('salesman')} className={`px-2 py-0.5 rounded ${authRole === 'salesman' ? 'bg-emerald-600 font-bold' : 'bg-slate-700'}`}>{t.salesman}</button>
              <button onClick={() => requestRoleSwitch('company_admin')} className={`px-2 py-0.5 rounded ${authRole === 'company_admin' ? 'bg-emerald-600 font-bold' : 'bg-slate-700'}`}>{t.company}</button>
              <button onClick={() => requestRoleSwitch('super_admin')} className={`px-2 py-0.5 rounded ${authRole === 'super_admin' ? 'bg-emerald-600 font-bold' : 'bg-slate-700'}`}>{t.super}</button>
            </div>
          </div>

          <main className="flex-1 p-3 overflow-y-auto space-y-3">
            {/* 1. SALESMAN PANEL */}
            {authRole === 'salesman' && (
              <>
                {activeTab === 'dashboard' && (
                  <div className="space-y-3 text-xs">
                    <div className="grid grid-cols-2 gap-2">
                      <div className="bg-emerald-50 border p-2.5 rounded-xl">
                        <p className="text-emerald-700 font-bold">{t.receivable}</p>
                        <p className="text-base font-bold text-emerald-900">{currentSymbol} 1500</p>
                      </div>
                      <div className="bg-blue-50 border p-2.5 rounded-xl">
                        <p className="text-blue-700 font-bold">{t.vanStock}</p>
                        <p className="text-base font-bold text-blue-900">165</p>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'sales' && (
                  <div className="space-y-2.5 text-xs">
                    <h2 className="font-bold text-gray-800">{t.salesBilling}</h2>
                    <select value={selectedPartyForSale} onChange={(e) => setSelectedPartyForSale(e.target.value)} className="w-full p-2 border rounded-xl bg-gray-50 font-bold">
                      <option value="">{t.selectCustomer}</option>
                      {parties.map(p => <option key={p.id} value={p.name}>{p.name} ({currentSymbol}{p.creditLimit})</option>)}
                    </select>

                    <div className="grid grid-cols-3 gap-1.5">
                      <select value={selectedItemId} onChange={(e) => setSelectedItemId(e.target.value)} className="col-span-1 p-2 border rounded-xl bg-gray-50">
                        <option value="">{t.product}</option>
                        {companyStock.map(i => <option key={i.id} value={i.id}>{i.name}</option>)}
                      </select>
                      <select value={itemUnitType} onChange={(e) => setItemUnitType(e.target.value)} className="p-2 border rounded-xl bg-gray-50 font-bold">
                        <option value="Pcs">Pcs</option>
                        <option value="Box">Box</option>
                        <option value="Carton">Carton</option>
                        <option value="Case">Case</option>
                      </select>
                      <input type="number" inputMode="numeric" value={itemQty} onChange={(e) => setItemQty(e.target.value)} className="p-2 border rounded-xl text-center font-bold" placeholder={t.qty} />
                    </div>

                    <button onClick={() => {
                      if(!selectedItemId) return;
                      const itm = companyStock.find(i => i.id === Number(selectedItemId));
                      setSalesCart([...salesCart, {...itm, name: `${itm.name} (${itemUnitType})`, qty: Number(itemQty)}]);
                      setSelectedItemId('');
                    }} className="w-full py-2 bg-emerald-600 text-white rounded-xl font-bold">{t.addToCart}</button>

                    {salesCart.map((c, i) => (
                      <div key={i} className="flex justify-between text-[11px] border-b py-1">
                        <span>{c.name} x {c.qty}</span>
                        <span className="font-bold">{currentSymbol} {c.salePrice * c.qty}</span>
                      </div>
                    ))}

                    <button onClick={handlePrintThermalReceipt} className="w-full py-3 bg-slate-900 text-white rounded-xl font-bold shadow flex items-center justify-center gap-2">
                      {t.printThermal}
                    </button>
                  </div>
                )}
              </>
            )}

            {/* 2. COMPANY ADMIN PANEL */}
            {authRole === 'company_admin' && (
              <div className="space-y-3 text-xs relative">
                <div className="bg-white p-3.5 rounded-xl border space-y-2 shadow-sm">
                  <h2 className="font-bold text-gray-900 text-sm">{t.companyPanel}</h2>
                  <p className="text-gray-500">{t.companyDesc}</p>
                </div>

                <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-xl space-y-2">
                  <h3 className="font-bold text-emerald-900">{t.addSalesman}</h3>
                  <input type="text" placeholder={t.sNamePlaceholder} value={newSName} onChange={(e) => setNewSName(e.target.value)} className="w-full p-2 border rounded-lg bg-white" />
                  <input type="text" placeholder={t.sPhonePlaceholder} value={newSPhone} onChange={(e) => setNewSPhone(e.target.value)} className="w-full p-2 border rounded-lg bg-white" />
                  <input type="text" placeholder={t.sRoutePlaceholder} value={newSRoute} onChange={(e) => setNewSRoute(e.target.value)} className="w-full p-2 border rounded-lg bg-white" />
                  <button onClick={() => {
                    if(!newSName || !newSPhone) return;
                    setCompanySalesmen([...companySalesmen, {id: Date.now(), name: newSName, phone: newSPhone, route: newSRoute || 'General Route', status: 'Active'}]);
                    setNewSName(''); setNewSPhone(''); setNewSRoute('');
                  }} className="w-full py-2 bg-emerald-600 text-white rounded-lg font-bold">{t.saveSalesman}</button>
                </div>

                <div className="bg-white p-3 rounded-xl border space-y-2">
                  <h3 className="font-bold text-gray-700">{t.salesmanList}</h3>
                  {companySalesmen.map(s => (
                    <div key={s.id} className="p-2 bg-gray-50 rounded-lg border flex justify-between items-center">
                      <div>
                        <p className="font-bold">{s.name} ({s.phone})</p>
                        <p className="text-[10px] text-emerald-700">{s.route}</p>
                      </div>
                      <span className="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-bold">{s.status}</span>
                    </div>
                  ))}
                </div>

                <div className="bg-blue-50 border border-blue-200 p-3 rounded-xl space-y-2">
                  <h3 className="font-bold text-blue-900">{t.stockMonitor}</h3>
                  {companyStock.map(st => (
                    <div key={st.id} className="p-2 bg-white rounded-lg border flex justify-between items-center">
                      <div>
                        <p className="font-bold">{st.name}</p>
                        <p className="text-[10px] text-gray-500">{t.mainGodown}: {st.mainGodown}</p>
                      </div>
                      <span className="text-[11px] font-bold text-blue-700 bg-blue-100 px-2 py-1 rounded">Van: {st.vanStock}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 3. SUPER ADMIN PANEL */}
            {authRole === 'super_admin' && (
              <div className="space-y-3 text-xs">
                <div className="bg-white p-3.5 rounded-xl border space-y-2 shadow-sm">
                  <h2 className="font-bold text-gray-900 text-sm">{t.superPanel}</h2>
                  <p className="text-gray-500">{t.superDesc}</p>
                </div>
                <div className="bg-indigo-50 border border-indigo-200 p-3 rounded-xl space-y-2">
                  <h3 className="font-bold text-indigo-900">{t.deviceList}</h3>
                  {globalConnectedDevices.map(dev => (
                    <div key={dev.id} className="bg-white p-2.5 rounded-xl border flex justify-between items-center">
                      <div>
                        <p className="font-bold">{dev.companyName}</p>
                        <p className="text-[10px] text-indigo-700">💻 {dev.deviceName} (IP: {dev.ip})</p>
                      </div>
                      <button onClick={() => setGlobalConnectedDevices([])} className="bg-rose-600 text-white px-2 py-1 rounded font-bold text-[10px]">{t.block}</button>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* Bottom Nav */}
          {authRole === 'salesman' && (
            <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t flex justify-around p-2 text-[10px] font-bold text-gray-600 shadow-lg">
              <button onClick={() => setActiveTab('dashboard')} className={activeTab === 'dashboard' ? 'text-emerald-700' : ''}>{t.dashboard}</button>
              <button onClick={() => setActiveTab('sales')} className={activeTab === 'sales' ? 'text-emerald-700' : ''}>{t.salesTab}</button>
            </nav>
          )}

          {/* PIN Prompt Modal */}
          {showPinModal && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-5 max-w-xs w-full space-y-3 shadow-2xl text-xs text-center">
                <h3 className="font-bold text-gray-900 text-sm">{t.pinTitle}</h3>
                <p className="text-[10px] text-gray-500">{t.pinHint}</p>
                <input type="password" inputMode="numeric" maxLength={4} value={pinInput} onChange={(e) => setPinInput(e.target.value)} placeholder="••••" className="w-full text-center text-xl py-2.5 border rounded-xl outline-none tracking-widest font-bold bg-gray-50" autoFocus />
                <div className="flex gap-2 pt-1">
                  <button onClick={() => setShowPinModal(false)} className="w-1/2 py-2.5 bg-gray-200 rounded-xl font-bold">{t.cancel}</button>
                  <button onClick={verifyPinAndSwitch} className="w-1/2 py-2.5 bg-emerald-600 text-white rounded-xl font-bold">{t.enter}</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
