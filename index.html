<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vyapar Enterprise - Complete Van Sales & Inventory SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 font-sans select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      // Global Settings & Multi-Currency / Language
      const [lang, setLang] = useState('bn');
      const [currency, setCurrency] = useState('BDT');
      const [currencySymbol, setCurrencySymbol] = useState('৳');

      // Auth & Panel States
      const [authRole, setAuthRole] = useState('salesman'); // salesman, company_admin, super_admin
      const [showPinModal, setShowPinModal] = useState(false);
      const [targetRole, setTargetRole] = useState('');
      const [pinInput, setPinInput] = useState('');

      const [activeTab, setActiveTab] = useState('dashboard');

      // Vyapar Core: Parties (Customers/Suppliers)
      const [parties, setParties] = useState([
        { id: 1, name: "ভাই ভাই স্টোর", phone: "01711223344", address: "সাভার বাজার", amount: 1500, type: "Receivable" },
        { id: 2, name: "মায়ের দোয়া এন্টারপ্রাইজ", phone: "01811556677", address: "নবীনগর", amount: 3200, type: "Receivable" }
      ]);
      const [showPartyModal, setShowPartyModal] = useState(false);
      const [pName, setPName] = useState('');
      const [pPhone, setPPhone] = useState('');
      const [pAddress, setPAddress] = useState('');
      const [pAmount, setPAmount] = useState('');
      const [pType, setPType] = useState('Receivable');

      // Vyapar Core: Items & Inventory Stock
      const [items, setItems] = useState([
        { id: 1, name: "ম্যাংগো জুস (কার্টন)", unit: "Carton", salePrice: 1440, purchasePrice: 1200, stock: 45 },
        { id: 2, name: "এনার্জি ড্রিংকস (পিস)", unit: "Pcs", salePrice: 50, purchasePrice: 40, stock: 120 }
      ]);
      const [showItemModal, setShowItemModal] = useState(false);
      const [iName, setIName] = useState('');
      const [iUnit, setIUnit] = useState('Pcs');
      const [iSale, setISale] = useState('');
      const [iPurchase, setIPurchase] = useState('');
      const [iStock, setIStock] = useState('');

      // Sales & Billing Cart
      const [selectedPartyForSale, setSelectedPartyForSale] = useState('');
      const [salesCart, setSalesCart] = useState([]);
      const [selectedItemId, setSelectedItemId] = useState('');
      const [itemQty, setItemQty] = useState(1);
      const [showPrintPreview, setShowPrintPreview] = useState(false);

      // Extra Requirement: Package Selling / Subscription Management (Super Admin)
      const [packages, setPackages] = useState([
        { id: 1, name: "স্ট্যান্ডার্ড মান্থলি ভ্যান প্যাকেজ", price: 1000, duration: "30 Days", status: "Active" },
        { id: 2, name: "ইন্টারপ্রাইজ ইয়ার্লি প্যাকেজ", price: 10000, duration: "365 Days", status: "Active" }
      ]);
      const [showPkgModal, setShowPkgModal] = useState(false);
      const [pkgName, setPkgName] = useState('');
      const [pkgPrice, setPkgPrice] = useState('');
      const [pkgDuration, setPkgDuration] = useState('30 Days');

      // Translations Dictionary
      const t = {
        bn: {
          appTitle: "ভাইপার ভ্যান সেলস ও ইনভেন্টরি",
          dashboard: "ড্যাশবোর্ড",
          parties: "পার্টি (কাস্টমার)",
          items: "স্টক ও আইটেম",
          sales: "সেলস ও বিলিং",
          packages: "প্যাকেজ ও সাবস্ক্রিপশন",
          receivable: "মোট পাবো (Receivable)",
          payable: "মোট দেবো (Payable)",
          totalStock: "মোট স্টক আইটেম",
          addParty: "+ নতুন পার্টি",
          addItem: "+ নতুন প্রোডাক্ট",
          addPackage: "+ নতুন প্যাকেজ যোগ করুন",
          printInvoice: "ইনভয়েস প্রিন্ট করুন",
          confirmPrint: "প্রিন্ট নিশ্চিত করুন",
          cancel: "বাতিল",
          save: "সংরক্ষণ করুন"
        },
        en: {
          appTitle: "Vyapar Van Sales & Inventory",
          dashboard: "Dashboard",
          parties: "Parties",
          items: "Items & Stock",
          sales: "Sales & Billing",
          packages: "Packages & Subs",
          receivable: "Total Receivable",
          payable: "Total Payable",
          totalStock: "Total Stock Items",
          addParty: "+ Add Party",
          addItem: "+ Add Item",
          addPackage: "+ Add Package",
          printInvoice: "Print Invoice",
          confirmPrint: "Confirm & Print",
          cancel: "Cancel",
          save: "Save"
        }
      };

      const handleCurrencyChange = (e) => {
        const val = e.target.value;
        setCurrency(val);
        if (val === 'BDT') setCurrencySymbol('৳');
        else if (val === 'USD') setCurrency('$');
        else if (val === 'INR') setCurrency('₹');
        else if (val === 'EUR') setCurrency('€');
      };

      // Role Switcher with PIN check
      const requestRoleSwitch = (role) => {
        if (role === 'salesman') {
          setAuthRole('salesman');
        } else {
          setTargetRole(role);
          setShowPinModal(true);
        }
      };

      const verifyPinAndSwitch = () => {
        if ((targetRole === 'company_admin' && pinInput === '2234') || (targetRole === 'super_admin' && pinInput === '1123')) {
          setAuthRole(targetRole);
          setShowPinModal(false);
          setPinInput('');
          setTargetRole('');
        } else {
          alert('ভুল পিন দিয়েছে! সঠিক পিন দিন (কোম্পানি: 2234, সুপার: 1123)');
        }
      };

      const handleSaveParty = () => {
        if (!pName) { alert('পার্টির নাম দিন'); return; }
        setParties([...parties, { id: Date.now(), name: pName, phone: pPhone || 'N/A', address: pAddress || 'N/A', amount: Number(pAmount) || 0, type: pType }]);
        setPName(''); setPPhone(''); setPAddress(''); setPAmount(''); setShowPartyModal(false);
      };

      const handleSaveItem = () => {
        if (!iName) { alert('প্রোডাক্টের নাম দিন'); return; }
        setItems([...items, { id: Date.now(), name: iName, unit: iUnit, salePrice: Number(iSale) || 0, purchasePrice: Number(iPurchase) || 0, stock: Number(iStock) || 0 }]);
        setIName(''); setISale(''); setIPurchase(''); setIStock(''); setShowItemModal(false);
      };

      const handleAddToCart = () => {
        if (!selectedItemId) return;
        const item = items.find(i => i.id === Number(selectedItemId));
        if (!item) return;
        const existing = salesCart.find(c => c.id === item.id);
        if (existing) {
          setSalesCart(salesCart.map(c => c.id === item.id ? {...c, qty: c.qty + Number(itemQty)} : c));
        } else {
          setSalesCart([...salesCart, { ...item, qty: Number(itemQty) }]);
        }
        setSelectedItemId(''); setItemQty(1);
      };

      const cartTotal = salesCart.reduce((sum, item) => sum + (item.salePrice * item.qty), 0);

      const handleSavePackage = () => {
        if (!pkgName) { alert('প্যাকেজের নাম দিন'); return; }
        setPackages([...packages, { id: Date.now(), name: pkgName, price: Number(pkgPrice) || 0, duration: pkgDuration, status: 'Active' }]);
        setPkgName(''); setPkgPrice(''); setShowPkgModal(false);
      };

      return (
        <div className="min-h-screen flex flex-col max-w-md mx-auto bg-white shadow-2xl relative pb-16">
          {/* Top Header with Multi-Language & Multi-Currency */}
          <header className="bg-emerald-800 text-white p-3 flex justify-between items-center shadow">
            <div>
              <h1 className="font-bold text-xs">{t[lang].appTitle}</h1>
              <p className="text-[10px] text-emerald-200 uppercase tracking-wider">রোল: {authRole}</p>
            </div>
            <div className="flex gap-1.5 items-center">
              <select value={lang} onChange={(e) => setLang(e.target.value)} className="bg-emerald-900 text-white text-[10px] p-1 rounded font-bold outline-none">
                <option value="bn">বাংলা</option>
                <option value="en">English</option>
              </select>
              <select value={currency} onChange={handleCurrencyChange} className="bg-emerald-900 text-white text-[10px] p-1 rounded font-bold outline-none">
                <option value="BDT">BDT (৳)</option>
                <option value="USD">USD ($)</option>
                <option value="INR">INR (₹)</option>
                <option value="EUR">EUR (€)</option>
              </select>
            </div>
          </header>

          {/* Role Switcher Bar */}
          <div className="bg-slate-900 text-white px-3 py-1.5 flex justify-between items-center text-[11px]">
            <span>প্যানেল পরিবর্তন:</span>
            <div className="flex gap-1">
              <button onClick={() => requestRoleSwitch('salesman')} className={`px-2 py-0.5 rounded ${authRole === 'salesman' ? 'bg-emerald-600 font-bold' : 'bg-slate-700'}`}>সেলসম্যান</button>
              <button onClick={() => requestRoleSwitch('company_admin')} className={`px-2 py-0.5 rounded ${authRole === 'company_admin' ? 'bg-emerald-600 font-bold' : 'bg-slate-700'}`}>কোম্পানি</button>
              <button onClick={() => requestRoleSwitch('super_admin')} className={`px-2 py-0.5 rounded ${authRole === 'super_admin' ? 'bg-emerald-600 font-bold' : 'bg-slate-700'}`}>সুপার</button>
            </div>
          </div>

          {/* Main Body Content */}
          <main className="flex-1 p-3 overflow-y-auto space-y-3">
            {authRole === 'salesman' && (
              <>
                {activeTab === 'dashboard' && (
                  <div className="space-y-3">
                    <div className="grid grid-cols-2 gap-2">
                      <div className="bg-emerald-50 border border-emerald-200 p-2.5 rounded-xl">
                        <p className="text-[11px] text-emerald-700 font-bold">{t[lang].receivable}</p>
                        <p className="text-base font-bold text-emerald-900">{currencySymbol} {parties.reduce((acc, p) => acc + p.amount, 0)}</p>
                      </div>
                      <div className="bg-blue-50 border border-blue-200 p-2.5 rounded-xl">
                        <p className="text-[11px] text-blue-700 font-bold">{t[lang].totalStock}</p>
                        <p className="text-base font-bold text-blue-900">{items.reduce((acc, i) => acc + i.stock, 0)} পিস</p>
                      </div>
                    </div>
                    <div className="bg-gray-50 border p-3 rounded-xl space-y-2">
                      <h2 className="text-xs font-bold text-gray-700">রুট কাস্টমার লিস্ট</h2>
                      {parties.map(p => (
                        <div key={p.id} className="bg-white p-2 rounded border flex justify-between items-center text-xs">
                          <div>
                            <p className="font-bold">{p.name}</p>
                            <p className="text-[10px] text-gray-500">{p.phone} | {p.address}</p>
                          </div>
                          <span className="font-bold text-emerald-600">{currencySymbol} {p.amount}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === 'parties' && (
                  <div className="space-y-2">
                    <div className="flex justify-between items-center">
                      <h2 className="font-bold text-xs text-gray-800">পার্টি লেজার তালিকা</h2>
                      <button onClick={() => setShowPartyModal(true)} className="bg-emerald-600 text-white text-[11px] font-bold px-2.5 py-1.5 rounded-lg shadow">{t[lang].addParty}</button>
                    </div>
                    {parties.map(p => (
                      <div key={p.id} className="p-2.5 bg-gray-50 border rounded-xl flex justify-between items-center text-xs">
                        <div>
                          <p className="font-bold text-gray-900">{p.name}</p>
                          <p className="text-[10px] text-gray-500">ফোন: {p.phone}</p>
                        </div>
                        <span className="font-bold text-emerald-700">{currencySymbol} {p.amount}</span>
                      </div>
                    ))}
                  </div>
                )}

                {activeTab === 'items' && (
                  <div className="space-y-2">
                    <div className="flex justify-between items-center">
                      <h2 className="font-bold text-xs text-gray-800">প্রোডাক্ট ও ভ্যান স্টক</h2>
                      <button onClick={() => setShowItemModal(true)} className="bg-emerald-600 text-white text-[11px] font-bold px-2.5 py-1.5 rounded-lg shadow">{t[lang].addItem}</button>
                    </div>
                    {items.map(item => (
                      <div key={item.id} className="p-2.5 bg-gray-50 border rounded-xl flex justify-between items-center text-xs">
                        <div>
                          <p className="font-bold text-gray-900">{item.name} ({item.unit})</p>
                          <p className="text-[10px] text-gray-500">ক্রয়: {currencySymbol}{item.purchasePrice} | বিক্রি: {currencySymbol}{item.salePrice}</p>
                        </div>
                        <span className="font-bold text-indigo-700">স্টক: {item.stock}</span>
                      </div>
                    ))}
                  </div>
                )}

                {activeTab === 'sales' && (
                  <div className="space-y-2.5 text-xs">
                    <h2 className="font-bold text-gray-800">সেলস ইনভয়েস ও বিলিং</h2>
                    <select value={selectedPartyForSale} onChange={(e) => setSelectedPartyForSale(e.target.value)} className="w-full p-2 border rounded-xl bg-gray-50 text-xs">
                      <option value="">-- পার্টি সিলেক্ট করুন --</option>
                      {parties.map(p => <option key={p.id} value={p.name}>{p.name}</option>)}
                    </select>
                    <div className="flex gap-1.5">
                      <select value={selectedItemId} onChange={(e) => setSelectedItemId(e.target.value)} className="flex-1 p-2 border rounded-xl bg-gray-50 text-xs">
                        <option value="">-- প্রোডাক্ট সিলেক্ট করুন --</option>
                        {items.map(i => <option key={i.id} value={i.id}>{i.name} (স্টক: {i.stock})</option>)}
                      </select>
                      <input type="number" min="1" value={itemQty} onChange={(e) => setItemQty(e.target.value)} className="w-14 p-2 border rounded-xl text-center" />
                      <button onClick={handleAddToCart} className="bg-emerald-600 text-white px-3 py-2 rounded-xl font-bold">যোগ</button>
                    </div>

                    <div className="border rounded-xl p-2.5 bg-gray-50 space-y-1.5">
                      <p className="font-bold text-gray-700 border-b pb-1">কার্ট সামারি</p>
                      {salesCart.length === 0 ? <p className="text-[11px] text-gray-400 text-center py-2">কোনো প্রোডাক্ট যোগ করা হয়নি</p> : 
                        salesCart.map((c, i) => (
                          <div key={i} className="flex justify-between text-[11px] border-b border-dashed py-0.5">
                            <span>{c.name} x {c.qty}</span>
                            <span className="font-bold">{currencySymbol} {c.salePrice * c.qty}</span>
                          </div>
                        ))
                      }
                      <div className="flex justify-between font-bold pt-1 text-emerald-900">
                        <span>মোট বিল:</span>
                        <span>{currencySymbol} {cartTotal}</span>
                      </div>
                    </div>

                    <button onClick={() => { if(salesCart.length > 0) setShowPrintPreview(true); else alert('কার্ট খালি!'); }} className="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl shadow">
                      🖨️ {t[lang].printInvoice}
                    </button>
                  </div>
                )}
              </>
            )}

            {authRole === 'company_admin' && (
              <div className="bg-white p-3 rounded-xl border space-y-2 text-xs">
                <h2 className="font-bold text-gray-800 text-sm">🏢 কোম্পানি অ্যাডমিন প্যানেল</h2>
                <p className="text-gray-600">সেলসম্যান রুট ট্র্যাকিং, ডেইলি ক্যাশ কালেকশন ও স্টক অডিট রিপোর্ট ম্যানেজমেন্ট।</p>
                <div className="p-2 bg-emerald-50 rounded border text-emerald-800 font-bold">মোট ক্যাশ সংগ্রহ আজ: {currencySymbol} 14,500</div>
              </div>
            )}

            {authRole === 'super_admin' && (
              <div className="space-y-3 text-xs">
                <div className="bg-white p-3 rounded-xl border space-y-2">
                  <div className="flex justify-between items-center">
                    <h2 className="font-bold text-gray-800 text-sm">👑 সুপার অ্যাডমিন ও প্যাকেজ কন্ট্রোল</h2>
                    <button onClick={() => setShowPkgModal(true)} className="bg-amber-600 text-white px-2.5 py-1.5 rounded-lg font-bold shadow">{t[lang].addPackage}</button>
                  </div>
                  <p className="text-gray-600">ক্লায়েন্ট সাবস্ক্রিপশন প্যাকেজ ম্যানেজমেন্ট এবং গ্লোবাল অ্যাপ লাইসেন্সিং কন্ট্রোল।</p>
                </div>

                <div className="space-y-2">
                  <h3 className="font-bold text-gray-700">বর্তমান প্যাকেজসমূহ:</h3>
                  {packages.map(pkg => (
                    <div key={pkg.id} className="p-2.5 bg-white border rounded-xl flex justify-between items-center shadow-sm">
                      <div>
                        <p className="font-bold">{pkg.name}</p>
                        <p className="text-[10px] text-gray-500">মেয়াদ: {pkg.duration}</p>
                      </div>
                      <span className="font-bold text-amber-700">{currencySymbol} {pkg.price}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* Bottom Nav Bar (Salesman Mode) */}
          {authRole === 'salesman' && (
            <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t flex justify-around p-2 text-[10px] font-bold text-gray-600 shadow-lg">
              <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center ${activeTab === 'dashboard' ? 'text-emerald-700' : ''}`}>ড্যাশবোর্ড</button>
              <button onClick={() => setActiveTab('parties')} className={`flex flex-col items-center ${activeTab === 'parties' ? 'text-emerald-700' : ''}`}>পার্টি</button>
              <button onClick={() => setActiveTab('items')} className={`flex flex-col items-center ${activeTab === 'items' ? 'text-emerald-700' : ''}`}>স্টক</button>
              <button onClick={() => setActiveTab('sales')} className={`flex flex-col items-center ${activeTab === 'sales' ? 'text-emerald-700' : ''}`}>সেলস বিলিং</button>
            </nav>
          )}

          {/* PIN Verification Modal */}
          {showPinModal && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-5 max-w-xs w-full space-y-3 shadow-2xl text-xs">
                <h3 className="font-bold text-gray-900 text-sm text-center">সিকিউরিটি পিন দিন</h3>
                <p className="text-[11px] text-gray-500 text-center">
                  {targetRole === 'company_admin' ? 'কোম্পানি পিন দিন (ডফল্ট: 2234)' : 'সুপার পিন দিন (ডফল্ট: 1123)'}
                </p>
                <input type="password" maxLength={4} value={pinInput} onChange={(e) => setPinInput(e.target.value)} placeholder="••••" className="w-full text-center text-lg py-2 border rounded-xl outline-none tracking-widest font-bold" />
                <div className="flex gap-2 pt-1">
                  <button onClick={() => setShowPinModal(false)} className="w-1/2 py-2 bg-gray-200 rounded-xl font-bold">{t[lang].cancel}</button>
                  <button onClick={verifyPinAndSwitch} className="w-1/2 py-2 bg-emerald-600 text-white rounded-xl font-bold">প্রবেশ</button>
                </div>
              </div>
            </div>
          )}

          {/* Manual Thermal Print Preview Modal */}
          {showPrintPreview && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-4 max-w-xs w-full space-y-3 shadow-2xl text-xs">
                <div className="text-center border-b pb-2">
                  <h3 className="font-bold text-sm">থার্মাল প্রিন্ট প্রিভিউ</h3>
                  <p className="text-[10px] text-gray-500">পার্টি: {selectedPartyForSale || 'সাধারণ কাস্টমার'}</p>
                </div>
                <div className="space-y-1 max-h-40 overflow-y-auto">
                  {salesCart.map((c, idx) => (
                    <div key={idx} className="flex justify-between text-[11px]">
                      <span>{c.name} ({c.qty})</span>
                      <span>{currencySymbol} {c.salePrice * c.qty}</span>
                    </div>
                  ))}
                </div>
                <div className="border-t pt-2 flex justify-between font-bold text-emerald-900">
                  <span>সর্বমোট প্রদেয়:</span>
                  <span>{currencySymbol} {cartTotal}</span>
                </div>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => setShowPrintPreview(false)} className="w-1/2 py-2 bg-gray-200 rounded-xl font-bold">{t[lang].cancel}</button>
                  <button onClick={() => { alert('সফলভাবে থার্মাল প্রিন্ট সম্পন্ন হয়েছে!'); setShowPrintPreview(false); setSalesCart([]); }} className="w-1/2 py-2 bg-emerald-600 text-white rounded-xl font-bold">🖨️ {t[lang].confirmPrint}</button>
                </div>
              </div>
            </div>
          )}

          {/* Add Party Modal */}
          {showPartyModal && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-4 max-w-xs w-full space-y-2.5 shadow-2xl text-xs">
                <h3 className="font-bold text-sm">নতুন পার্টি যোগ করুন</h3>
                <input type="text" placeholder="পার্টির নাম" value={pName} onChange={(e) => setPName(e.target.value)} className="w-full p-2 border rounded-xl" />
                <input type="text" placeholder="ফোন নম্বর" value={pPhone} onChange={(e) => setPPhone(e.target.value)} className="w-full p-2 border rounded-xl" />
                <input type="text" placeholder="ঠিকানা" value={pAddress} onChange={(e) => setPAddress(e.target.value)} className="w-full p-2 border rounded-xl" />
                <input type="number" placeholder="প্রারম্ভিক বকেয়া পরিমাণ" value={pAmount} onChange={(e) => setPAmount(e.target.value)} className="w-full p-2 border rounded-xl" />
                <div className="flex gap-2 pt-1">
                  <button onClick={() => setShowPartyModal(false)} className="w-1/2 py-2 bg-gray-200 rounded-xl font-bold">{t[lang].cancel}</button>
                  <button onClick={handleSaveParty} className="w-1/2 py-2 bg-emerald-600 text-white rounded-xl font-bold">{t[lang].save}</button>
                </div>
              </div>
            </div>
          )}

          {/* Add Item Modal */}
          {showItemModal && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-4 max-w-xs w-full space-y-2.5 shadow-2xl text-xs">
                <h3 className="font-bold text-sm">নতুন প্রোডাক্ট ও স্টক</h3>
                <input type="text" placeholder="প্রোডাক্টের নাম" value={iName} onChange={(e) => setIName(e.target.value)} className="w-full p-2 border rounded-xl" />
                <select value={iUnit} onChange={(e) => setIUnit(e.target.value)} className="w-full p-2 border rounded-xl bg-gray-50">
                  <option value="Pcs">পিস (Pcs)</option>
                  <option value="Carton">কার্টন (Carton)</option>
                  <option value="Kg">কেজি (Kg)</option>
                </select>
                <input type="number" placeholder="ক্রয় মূল্য" value={iPurchase} onChange={(e) => setIPurchase(e.target.value)} className="w-full p-2 border rounded-xl" />
                <input type="number" placeholder="বিক্রয় মূল্য" value={iSale} onChange={(e) => setISale(e.target.value)} className="w-full p-2 border rounded-xl" />
                <input type="number" placeholder="স্টক পরিমাণ" value={iStock} onChange={(e) => setIStock(e.target.value)} className="w-full p-2 border rounded-xl" />
                <div className="flex gap-2 pt-1">
                  <button onClick={() => setShowItemModal(false)} className="w-1/2 py-2 bg-gray-200 rounded-xl font-bold">{t[lang].cancel}</button>
                  <button onClick={handleSaveItem} className="w-1/2 py-2 bg-emerald-600 text-white rounded-xl font-bold">{t[lang].save}</button>
                </div>
              </div>
            </div>
          )}

          {/* Add Package Modal */}
          {showPkgModal && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-4 max-w-xs w-full space-y-2.5 shadow-2xl text-xs">
                <h3 className="font-bold text-sm">নতুন সাবস্ক্রিপশন প্যাকেজ</h3>
                <input type="text" placeholder="প্যাকেজের নাম" value={pkgName} onChange={(e) => setPkgName(e.target.value)} className="w-full p-2 border rounded-xl" />
                <input type="number" placeholder="মূল্য (Price)" value={pkgPrice} onChange={(e) => setPkgPrice(e.target.value)} className="w-full p-2 border rounded-xl" />
                <select value={pkgDuration} onChange={(e) => setPkgDuration(e.target.value)} className="w-full p-2 border rounded-xl bg-gray-50">
                  <option value="30 Days">৩০ দিন (1 Month)</option>
                  <option value="365 Days">৩৬৫ দিন (1 Year)</option>
                </select>
                <div className="flex gap-2 pt-1">
                  <button onClick={() => setShowPkgModal(false)} className="w-1/2 py-2 bg-gray-200 rounded-xl font-bold">{t[lang].cancel}</button>
                  <button onClick={handleSavePackage} className="w-1/2 py-2 bg-emerald-600 text-white rounded-xl font-bold">{t[lang].save}</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
