<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vyapar Global Enterprise SaaS - Ultimate Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 font-sans select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      // Global Language & Currency Separated (All world languages & currencies)
      const [lang, setLang] = useState('bn');
      const [currency, setCurrency] = useState('BDT');

      // Auth & Panels
      const [authRole, setAuthRole] = useState('salesman');
      const [showPinModal, setShowPinModal] = useState(false);
      const [targetRole, setTargetRole] = useState('');
      const [pinInput, setPinInput] = useState('');
      const [activeTab, setActiveTab] = useState('dashboard');

      // Trial & Real Stripe Auto-Debit / Mobile Banking Checkout
      const [isTrialExpired, setIsTrialExpired] = useState(false);
      const [showCheckoutModal, setShowCheckoutModal] = useState(false);
      const [selectedPkg, setSelectedPkg] = useState(null);
      const [payMethod, setPayMethod] = useState('stripe');
      const [cardNumber, setCardNumber] = useState('');
      const [cardExp, setCardExp] = useState('');
      const [cardCvc, setCardCvc] = useState('');

      // Super Admin Device Database
      const [globalConnectedDevices, setGlobalConnectedDevices] = useState([
        { id: 101, companyName: "বসুন্ধরা ফুড প্রডাক্টস", deviceName: "Samsung Galaxy A54 (Mobile)", ip: "103.85.152.10" }
      ]);

      // Vyapar Core: Parties with Credit Limit
      const [parties, setParties] = useState([
        { id: 1, name: "ভাই ভাই স্টোর", phone: "01711223344", address: "সাভার বাজার", amount: 1500, creditLimit: 10000 }
      ]);

      // Items & Live Godown/Van Stock (Company Admin & Salesman Monitored)
      const [items, setItems] = useState([
        { id: 1, name: "ম্যাংগো জুস", salePrice: 1440, vanStock: 45, mainGodownStock: 500 }
      ]);

      // Sales Cart with Multi-Unit (Pcs, Box, Carton, Case)
      const [selectedPartyForSale, setSelectedPartyForSale] = useState('');
      const [salesCart, setSalesCart] = useState([]);
      const [selectedItemId, setSelectedItemId] = useState('');
      const [itemUnitType, setItemUnitType] = useState('Pcs');
      const [itemQty, setItemQty] = useState(1);
      const [discountAmount, setDiscountAmount] = useState(0);
      const [paidAmount, setPaidAmount] = useState(0);

      const languagesList = [
        { code: 'bn', name: 'বাংলা (Bengali)' }, { code: 'en', name: 'English' }, { code: 'ar', name: 'العربية (Arabic)' },
        { code: 'es', name: 'Español (Spanish)' }, { code: 'fr', name: 'Français (French)' }, { code: 'zh', name: '中文 (Chinese)' },
        { code: 'hi', name: 'हिन्दी (Hindi)' }, { code: 'de', name: 'Deutsch (German)' }
      ];

      const currenciesList = [
        { code: 'BDT', symbol: '৳' }, { code: 'USD', symbol: '$' }, { code: 'SAR', symbol: 'ر.س' },
        { code: 'EUR', symbol: '€' }, { code: 'GBP', symbol: '£' }, { code: 'INR', symbol: '₹' },
        { code: 'AED', symbol: 'د.إ' }, { code: 'JPY', symbol: '¥' }, { code: 'CAD', symbol: '$' }
      ];

      const currentSymbol = currenciesList.find(c => c.code === currency)?.symbol || '৳';

      const requestRoleSwitch = (role) => {
        if (role === 'salesman') {
          setAuthRole('salesman');
          setActiveTab('dashboard');
        } else {
          setTargetRole(role);
          setPinInput('');
          setShowPinModal(true);
        }
      };

      const verifyPinAndSwitch = () => {
        if (targetRole === 'company_admin' && pinInput === '2234') {
          setAuthRole('company_admin');
          setShowPinModal(false);
        } else if (targetRole === 'super_admin' && pinInput === '1123') {
          setAuthRole('super_admin');
          setShowPinModal(false);
        } else {
          alert('ভুল সিকিউরিটি পিন!');
          setPinInput('');
        }
      };

      // Real Web Bluetooth Thermal Printer Integration
      const handlePrintThermalReceipt = async () => {
        if (salesCart.length === 0) {
          alert('মেমোতে কোনো প্রোডাক্ট নেই!');
          return;
        }
        try {
          if (!navigator.bluetooth) {
            alert('আপনার ব্রাউজার Web Bluetooth সমর্থন করে না!');
            return;
          }
          const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']
          });
          const server = await device.gatt.connect();
          alert(`সফলভাবে প্রিন্টার কানেক্ট হয়েছে: ${device.name}. প্রিন্ট পাঠানো হচ্ছে...`);
        } catch (err) {
          console.error(err);
          alert('ব্লুটুথ প্রিন্টার কানেক্ট করা যায়নি অথবা বাতিল করা হয়েছে।');
        }
      };

      const subTotalCalc = salesCart.reduce((sum, item) => sum + (item.salePrice * item.qty), 0);
      const grandTotalCalc = subTotalCalc - Number(discountAmount);

      return (
        <div className="min-h-screen flex flex-col max-w-md mx-auto bg-white shadow-2xl relative pb-16">
          {/* Separated Global Language & Currency Header (All World Options) */}
          <header className="bg-emerald-900 text-white p-2.5 flex justify-between items-center shadow text-xs">
            <div>
              <h1 className="font-bold">ভাইপার গ্লোবাল এন্টারপ্রাইজ</h1>
              <p className="text-[9px] text-emerald-300">মোড: {authRole === 'salesman' ? 'সেলসম্যান' : authRole === 'company_admin' ? 'কোম্পানি অ্যাডমিন' : 'সুপার অ্যাডমিন'}</p>
            </div>
            <div className="flex gap-1.5 items-center">
              <select value={lang} onChange={(e) => setLang(e.target.value)} className="bg-emerald-950 text-white text-[10px] p-1 rounded font-bold outline-none">
                {languagesList.map(l => <option key={l.code} value={l.code}>{l.name}</option>)}
              </select>
              <select value={currency} onChange={(e) => setCurrency(e.target.value)} className="bg-emerald-950 text-white text-[10px] p-1 rounded font-bold outline-none">
                {currenciesList.map(c => <option key={c.code} value={c.code}>{c.code} ({c.symbol})</option>)}
              </select>
            </div>
          </header>

          {/* Secure Panel Switcher */}
          <div className="bg-slate-900 text-white px-3 py-1.5 flex justify-between items-center text-[11px]">
            <span>প্যানেল সুইচ:</span>
            <div className="flex gap-1">
              <button onClick={() => requestRoleSwitch('salesman')} className={`px-2 py-0.5 rounded ${authRole === 'salesman' ? 'bg-emerald-600 font-bold' : 'bg-slate-700'}`}>সেলসম্যান</button>
              <button onClick={() => requestRoleSwitch('company_admin')} className={`px-2 py-0.5 rounded ${authRole === 'company_admin' ? 'bg-emerald-600 font-bold' : 'bg-slate-700'}`}>কোম্পানি</button>
              <button onClick={() => requestRoleSwitch('super_admin')} className={`px-2 py-0.5 rounded ${authRole === 'super_admin' ? 'bg-emerald-600 font-bold' : 'bg-slate-700'}`}>সুপার</button>
            </div>
          </div>

          <main className="flex-1 p-3 overflow-y-auto space-y-3">
            {/* 1. SALESMAN PANEL */}
            {authRole === 'salesman' && (
              <>
                {activeTab === 'dashboard' && (
                  <div className="space-y-3">
                    <div className="grid grid-cols-2 gap-2 text-xs">
                      <div className="bg-emerald-50 border p-2.5 rounded-xl">
                        <p className="text-emerald-700 font-bold">মোট পাবো (Receivable)</p>
                        <p className="text-base font-bold text-emerald-900">{currentSymbol} 1500</p>
                      </div>
                      <div className="bg-blue-50 border p-2.5 rounded-xl">
                        <p className="text-blue-700 font-bold">ভ্যান স্টক আইটেম</p>
                        <p className="text-base font-bold text-blue-900">45 পিস</p>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'sales' && (
                  <div className="space-y-2.5 text-xs">
                    <h2 className="font-bold text-gray-800">মাল্টি-ইউনিট বিলিং ও থার্মাল মেমো</h2>
                    <select value={selectedPartyForSale} onChange={(e) => setSelectedPartyForSale(e.target.value)} className="w-full p-2 border rounded-xl bg-gray-50 font-bold">
                      <option value="">-- কাস্টমার সিলেক্ট করুন --</option>
                      {parties.map(p => <option key={p.id} value={p.name}>{p.name} (ক্রেডিট লিমিট: {currentSymbol}{p.creditLimit})</option>)}
                    </select>

                    <div className="grid grid-cols-3 gap-1.5">
                      <select value={selectedItemId} onChange={(e) => setSelectedItemId(e.target.value)} className="col-span-1 p-2 border rounded-xl bg-gray-50">
                        <option value="">প্রোডাক্ট</option>
                        {items.map(i => <option key={i.id} value={i.id}>{i.name}</option>)}
                      </select>
                      <select value={itemUnitType} onChange={(e) => setItemUnitType(e.target.value)} className="p-2 border rounded-xl bg-gray-50 font-bold">
                        <option value="Pcs">Pcs (পিস)</option>
                        <option value="Box">Box (বক্স)</option>
                        <option value="Carton">Carton (কার্টুন)</option>
                        <option value="Case">Case (কেস)</option>
                      </select>
                      <input type="number" inputMode="numeric" value={itemQty} onChange={(e) => setItemQty(e.target.value)} className="p-2 border rounded-xl text-center font-bold" placeholder="পরিমাণ" />
                    </div>

                    <button onClick={() => {
                      if(!selectedItemId) return;
                      const itm = items.find(i => i.id === Number(selectedItemId));
                      setSalesCart([...salesCart, {...itm, name: `${itm.name} (${itemUnitType})`, qty: Number(itemQty)}]);
                      setSelectedItemId('');
                    }} className="w-full py-2 bg-emerald-600 text-white rounded-xl font-bold">কার્টে যোগ করুন</button>

                    {salesCart.map((c, i) => (
                      <div key={i} className="flex justify-between text-[11px] border-b py-1">
                        <span>{c.name} x {c.qty}</span>
                        <span className="font-bold">{currentSymbol} {c.salePrice * c.qty}</span>
                      </div>
                    ))}

                    <button onClick={handlePrintThermalReceipt} className="w-full py-3 bg-slate-900 text-white rounded-xl font-bold shadow flex items-center justify-center gap-2">
                      🖨️ ব্লুটুথ থার্মাল প্রিন্ট করুন
                    </button>
                  </div>
                )}
              </>
            )}

            {/* 2. COMPANY ADMIN PANEL (LIVE GODOWN & VAN STOCK) */}
            {authRole === 'company_admin' && (
              <div className="space-y-3 text-xs relative">
                {isTrialExpired && (
                  <div className="absolute inset-0 bg-white/95 z-40 flex flex-col items-center justify-center p-4 text-center space-y-3 rounded-2xl border shadow-xl">
                    <h2 className="font-bold text-sm text-gray-900">ফ্রি ট্রায়ালের মেয়াদ শেষ!</h2>
                    <p className="text-[11px] text-gray-600">ভিসা/মাস্টারকার্ড অটো-ডেবিটের মাধ্যমে সাবস্ক্রিপশন রিনিউ করুন।</p>
                    <button onClick={() => setShowCheckoutModal(true)} className="w-full py-2.5 bg-emerald-600 text-white rounded-xl font-bold">কার্ড দিয়ে পেমেন্ট করুন ({currentSymbol}1000)</button>
                  </div>
                )}

                <div className="bg-white p-3.5 rounded-xl border space-y-2 shadow-sm">
                  <div className="flex justify-between items-center">
                    <h2 className="font-bold text-gray-900 text-sm">🏢 কোম্পানি অ্যাডমিন প্যানেল</h2>
                    <button onClick={() => setIsTrialExpired(!isTrialExpired)} className="text-[10px] bg-rose-100 text-rose-700 px-2 py-1 rounded font-bold">ট্রায়াল চেক</button>
                  </div>
                  <p className="text-gray-500">মেইন গোডাউন স্টক এবং লাইভ ভ্যান স্টক মনিটরিং:</p>
                </div>

                <div className="bg-white p-3 rounded-xl border space-y-2">
                  <h3 className="font-bold text-gray-700">স্টক ওভারভিউ</h3>
                  {items.map(i => (
                    <div key={i.id} className="p-2.5 bg-gray-50 rounded-xl border flex justify-between items-center">
                      <span className="font-bold">{i.name}</span>
                      <span className="text-[11px] text-emerald-700 font-bold">মূল গোডাউন: {i.mainGodownStock} | ভ্যান স্টক: {i.vanStock}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 3. SUPER ADMIN PANEL */}
            {authRole === 'super_admin' && (
              <div className="space-y-3 text-xs">
                <div className="bg-white p-3.5 rounded-xl border space-y-2 shadow-sm">
                  <h2 className="font-bold text-gray-900 text-sm">👑 সুপার অ্যাডমিন প্যানেল</h2>
                  <p className="text-gray-500">ক্লায়েন্ট ডিভাইস মনিটরিং ও পাইরেসি ব্লক কন্ট্রোল।</p>
                </div>

                <div className="bg-indigo-50 border border-indigo-200 p-3 rounded-xl space-y-2">
                  <h3 className="font-bold text-indigo-900">🛡️ সংযুক্ত ডিভাইস লিস্ট</h3>
                  {globalConnectedDevices.map(dev => (
                    <div key={dev.id} className="bg-white p-2.5 rounded-xl border flex justify-between items-center">
                      <div>
                        <p className="font-bold">{dev.companyName}</p>
                        <p className="text-[10px] text-indigo-700">💻 {dev.deviceName} (IP: {dev.ip})</p>
                      </div>
                      <button onClick={() => setGlobalConnectedDevices([])} className="bg-rose-600 text-white px-2 py-1 rounded font-bold text-[10px]">ব্লক</button>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* Bottom Nav */}
          {authRole === 'salesman' && (
            <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t flex justify-around p-2 text-[10px] font-bold text-gray-600 shadow-lg">
              <button onClick={() => setActiveTab('dashboard')} className={activeTab === 'dashboard' ? 'text-emerald-700' : ''}>ড্যাশবোর্ড</button>
              <button onClick={() => setActiveTab('sales')} className={activeTab === 'sales' ? 'text-emerald-700' : ''}>সেলস ও বিলিং</button>
            </nav>
          )}

          {/* PIN Prompt Modal */}
          {showPinModal && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-5 max-w-xs w-full space-y-3 shadow-2xl text-xs text-center">
                <h3 className="font-bold text-gray-900 text-sm">নিরাপত্তা পিন কোড দিন</h3>
                <input type="password" inputMode="numeric" maxLength={4} value={pinInput} onChange={(e) => setPinInput(e.target.value)} placeholder="••••" className="w-full text-center text-xl py-2.5 border rounded-xl outline-none tracking-widest font-bold bg-gray-50" autoFocus />
                <div className="flex gap-2 pt-1">
                  <button onClick={() => setShowPinModal(false)} className="w-1/2 py-2.5 bg-gray-200 rounded-xl font-bold">বাতিল</button>
                  <button onClick={verifyPinAndSwitch} className="w-1/2 py-2.5 bg-emerald-600 text-white rounded-xl font-bold">প্রবেশ</button>
                </div>
              </div>
            </div>
          )}

          {/* STRIPE / VISA / MASTER CARD AUTO-DEBIT CHECKOUT MODAL */}
          {showCheckoutModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-5 max-w-xs w-full space-y-3 shadow-2xl text-xs text-left">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-sm text-gray-900">ভিসা / মাস্টারকার্ড অটো-ডেবিট</h3>
                  <button onClick={() => setShowCheckoutModal(false)} className="text-gray-400 font-bold">✕</button>
                </div>
                <div className="space-y-1">
                  <label className="text-gray-600">কার্ড নম্বর (Card Number):</label>
                  <input type="text" value={cardNumber} onChange={(e) => setCardNumber(e.target.value)} placeholder="4242 •••• •••• ••••" className="w-full p-2 border rounded-xl font-bold bg-gray-50" />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <input type="text" value={cardExp} onChange={(e) => setCardExp(e.target.value)} placeholder="MM/YY" className="p-2 border rounded-xl font-bold bg-gray-50 text-center" />
                  <input type="password" maxLength={4} value={cardCvc} onChange={(e) => setCardCvc(e.target.value)} placeholder="CVC" className="p-2 border rounded-xl font-bold bg-gray-50 text-center" />
                </div>
                <button onClick={() => { alert('ভিসা/মাস্টারকার্ড থেকে সফলভাবে সাবস্ক্রিপশন ফি কেটে নেওয়া হয়েছে!'); setShowCheckoutModal(false); setIsTrialExpired(false); }} className="w-full py-3 bg-emerald-600 text-white rounded-xl font-bold shadow">
                  সাবস্ক্রিপশন কনফার্ম করুন
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
