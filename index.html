<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vyapar Global Enterprise SaaS - Super Admin Device Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 font-sans select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Global Language & Currency
      const [lang, setLang] = useState('bn');
      const [currency, setCurrency] = useState('BDT');
      const [currencySymbol, setCurrencySymbol] = useState('৳');

      // Auth & Panels
      const [authRole, setAuthRole] = useState('salesman');
      const [showPinModal, setShowPinModal] = useState(false);
      const [targetRole, setTargetRole] = useState('');
      const [pinInput, setPinInput] = useState('');
      const [activeTab, setActiveTab] = useState('dashboard');

      // 14 Days Free Trial & Subscription State
      const [isTrialExpired, setIsTrialExpired] = useState(false);
      const [showCheckoutModal, setShowCheckoutModal] = useState(false);
      const [selectedPaymentMethod, setSelectedPaymentMethod] = useState('bkash');
      const [selectedPackageForBuy, setSelectedPackageForBuy] = useState(null);

      // --- HIGH SECURITY: Centralized Multi-Device Database for Super Admin ---
      const [globalConnectedDevices, setGlobalConnectedDevices] = useState([
        { id: 101, companyName: "বসুন্ধরা ফুড প্রডাক্টস", email: "admin@bashundharafoods.com", deviceName: "Samsung Galaxy A54 (Mobile)", ip: "103.85.152.10", status: "Active" },
        { id: 102, companyName: "বসুন্ধরা ফুড প্রডাক্টস", email: "admin@bashundharafoods.com", deviceName: "HP ProBook Laptop (PC)", ip: "103.85.152.45", status: "Active" },
        { id: 103, companyName: "প্রাণ ডিস্ট্রিবিউশন", email: "admin@prandist.com", deviceName: "Xiaomi Note 12 (Mobile)", ip: "114.30.12.88", status: "Active" }
      ]);
      const [showDeviceAlertModal, setShowDeviceAlertModal] = useState(false);

      // Vyapar Core: Parties
      const [parties, setParties] = useState([
        { id: 1, name: "ভাই ভাই স্টোর", phone: "01711223344", address: "সাভার বাজার", amount: 1500, type: "Receivable" },
        { id: 2, name: "মায়ের দোয়া এন্টারপ্রাইজ", phone: "01811556677", address: "নবীনগর", amount: 3200, type: "Receivable" }
      ]);
      const [showPartyModal, setShowPartyModal] = useState(false);
      const [pName, setPName] = useState('');
      const [pPhone, setPPhone] = useState('');
      const [pAddress, setPAddress] = useState('');
      const [pAmount, setPAmount] = useState('');

      // Vyapar Core: Items & Godown Stock
      const [items, setItems] = useState([
        { id: 1, name: "ম্যাংগো জুস", unit: "Carton", salePrice: 1440, purchasePrice: 1200, vanStock: 45, mainGodownStock: 500 },
        { id: 2, name: "এনার্জি ড্রিংকস", unit: "Pcs", salePrice: 50, purchasePrice: 40, vanStock: 120, mainGodownStock: 1000 }
      ]);
      const [showItemModal, setShowItemModal] = useState(false);
      const [iName, setIName] = useState('');
      const [iUnit, setIUnit] = useState('Pcs');
      const [iSale, setISale] = useState('');
      const [iPurchase, setIPurchase] = useState('');
      const [iGodownStock, setIGodownStock] = useState('');
      const [iVanStock, setIVanStock] = useState('');

      // Company Admin Core: Salesmen & Routes
      const [salesmen, setSalesmen] = useState([
        { id: 1, name: "রহিম মিয়া", phone: "01911223344", assignedRoute: "সাভার রুট - এ", status: "Active" },
        { id: 2, name: "করিম আহমেদ", phone: "01822334455", assignedRoute: "নবীনগর রুট - বি", status: "Active" }
      ]);
      const [showSalesmanModal, setShowSalesmanModal] = useState(false);
      const [sName, setSName] = useState('');
      const [sPhone, setSPhone] = useState('');
      const [sRoute, setSRoute] = useState('');

      const [routes, setRoutes] = useState([
        { id: 1, routeName: "সাভার রুট - এ", salesman: "রহিম মিয়া", scheduleDays: "শনিবার, সোমবার, বুধবার" },
        { id: 2, routeName: "নবীনগর রুট - বি", salesman: "করিম আহমেদ", scheduleDays: "রবিবার, মঙ্গলবার, বৃহস্পতিবার" }
      ]);
      const [showRouteModal, setShowRouteModal] = useState(false);
      const [rName, setRName] = useState('');
      const [rSalesman, setRSalesman] = useState('');
      const [rDays, setRDays] = useState('');

      // Super Admin Core
      const [packages, setPackages] = useState([
        { id: 1, name: "স্ট্যান্ডার্ড মান্থলি ভ্যান প্যাকেজ", price: 1000, duration: "30 Days", status: "Active" },
        { id: 2, name: "ইন্টারপ্রাইজ ইয়ার্লি প্যাকেজ", price: 10000, duration: "365 Days", status: "Active" }
      ]);
      const [showPkgModal, setShowPkgModal] = useState(false);
      const [pkgName, setPkgName] = useState('');
      const [pkgPrice, setPkgPrice] = useState('');
      const [pkgDuration, setPkgDuration] = useState('30 Days');

      // Sales & Thermal Cart
      const [selectedPartyForSale, setSelectedPartyForSale] = useState('');
      const [salesCart, setSalesCart] = useState([]);
      const [selectedItemId, setSelectedItemId] = useState('');
      const [itemQty, setItemQty] = useState(1);
      const [discountAmount, setDiscountAmount] = useState(0);
      const [paidAmount, setPaidAmount] = useState(0);
      const [paymentType, setPaymentType] = useState('Cash');
      const [showPrintPreview, setShowPrintPreview] = useState(false);

      const t = {
        bn: { appTitle: "ভাইপার গ্লোবাল ভ্যান সেলস", dashboard: "ড্যাশবোর্ড", parties: "পার্টি (কাস্টমার)", items: "স্টক ও গুডাউন", sales: "সেলস ও বিলিং", receivable: "মোট পাবো (Receivable)", totalStock: "ভ্যান স্টক আইটেম", addParty: "+ নতুন পার্টি", addItem: "+ নতুন প্রোডাক্ট", addSalesman: "+ সেলসম্যান যোগ", addRoute: "+ রুট শিডিউল", addPackage: "+ প্যাকেজ যোগ" },
        en: { appTitle: "Vyapar Global Van Sales", dashboard: "Dashboard", parties: "Parties", items: "Items & Godown", sales: "Sales & Billing", receivable: "Total Receivable", totalStock: "Van Stock Items", addParty: "+ Add Party", addItem: "+ Add Item", addSalesman: "+ Add Salesman", addRoute: "+ Add Route Schedule", addPackage: "+ Add Package" }
      };

      const handleCurrencyChange = (e) => {
        const val = e.target.value;
        setCurrency(val);
        const symbols = { BDT: '৳', USD: '$', EUR: '€', GBP: '£', INR: '₹', SAR: 'ر.س', AED: 'د.إ', JPY: '¥', CNY: '¥', CAD: '$', AUD: '$' };
        setCurrencySymbol(symbols[val] || val);
      };

      const requestRoleSwitch = (role) => {
        if (role === 'salesman') {
          setAuthRole('salesman');
          setActiveTab('dashboard');
        } else {
          setTargetRole(role);
          setPinInput('');
          setShowPinModal(true);
        }
      };

      const verifyPinAndSwitch = () => {
        if (targetRole === 'company_admin' && pinInput === '2234') {
          setAuthRole('company_admin');
          setShowPinModal(false);
        } else if (targetRole === 'super_admin' && pinInput === '1123') {
          setAuthRole('super_admin');
          setShowPinModal(false);
        } else {
          alert('ভুল পিন! (কোম্পানি পিন: 2234, সুপার পিন: 1123)');
          setPinInput('');
        }
      };

      // Super Admin Device Control: Terminate or Block Device
      const superAdminTerminateDevice = (id) => {
        setGlobalConnectedDevices(globalConnectedDevices.filter(d => d.id !== id));
        alert('সুপার অ্যাডমিন প্যানেল থেকে ডিভাইসটি সফলভাবে ব্লক ও টার্মিনেট করা হয়েছে!');
      };

      const handleSaveParty = () => {
        if (!pName) { alert('পার্টির নাম দিন'); return; }
        setParties([...parties, { id: Date.now(), name: pName, phone: pPhone || 'N/A', address: pAddress || 'N/A', amount: Number(pAmount) || 0, type: "Receivable" }]);
        setPName(''); setPPhone(''); setPAddress(''); setPAmount(''); setShowPartyModal(false);
      };

      const handleSaveItem = () => {
        if (!iName) { alert('প্রোডাক্টের নাম দিন'); return; }
        setItems([...items, { id: Date.now(), name: iName, unit: iUnit, salePrice: Number(iSale) || 0, purchasePrice: Number(iPurchase) || 0, vanStock: Number(iVanStock) || 0, mainGodownStock: Number(iGodownStock) || 0 }]);
        setIName(''); setISale(''); setIPurchase(''); setIVanStock(''); setIGodownStock(''); setShowItemModal(false);
      };

      const handleSaveSalesman = () => {
        if (!sName) { alert('সেলসম্যানের নাম দিন'); return; }
        setSalesmen([...salesmen, { id: Date.now(), name: sName, phone: sPhone || 'N/A', assignedRoute: sRoute || 'সাধারণ রুট', status: 'Active' }]);
        setSName(''); setSPhone(''); setSRoute(''); setShowSalesmanModal(false);
      };

      const handleSaveRoute = () => {
        if (!rName) { alert('রুটের নাম দিন'); return; }
        setRoutes([...routes, { id: Date.now(), routeName: rName, salesman: rSalesman || 'অনির্ধারিত', scheduleDays: rDays || 'প্রতিদিন' }]);
        setRName(''); setRSalesman(''); setRDays(''); setShowRouteModal(false);
      };

      const handleSavePackage = () => {
        if (!pkgName) { alert('প্যাকেজের নাম দিন'); return; }
        setPackages([...packages, { id: Date.now(), name: pkgName, price: Number(pkgPrice) || 0, duration: pkgDuration, status: 'Active' }]);
        setPkgName(''); setPkgPrice(''); setShowPkgModal(false);
      };

      const handleAddToCart = () => {
        if (!selectedItemId) return;
        const item = items.find(i => i.id === Number(selectedItemId));
        if (!item) return;
        const existing = salesCart.find(c => c.id === item.id);
        if (existing) {
          setSalesCart(salesCart.map(c => c.id === item.id ? {...c, qty: c.qty + Number(itemQty)} : c));
        } else {
          setSalesCart([...salesCart, { ...item, qty: Number(itemQty) }]);
        }
        setSelectedItemId(''); setItemQty(1);
      };

      const subTotalCalc = salesCart.reduce((sum, item) => sum + (item.salePrice * item.qty), 0);
      const grandTotalCalc = subTotalCalc - Number(discountAmount);
      const currentDueCalc = grandTotalCalc - Number(paidAmount);
      const currentLangDict = t[lang] || t['bn'];

      return (
        <div className="min-h-screen flex flex-col max-w-md mx-auto bg-white shadow-2xl relative pb-16">
          {/* Top Header */}
          <header className="bg-emerald-800 text-white p-3 flex justify-between items-center shadow">
            <div>
              <h1 className="font-bold text-xs">{currentLangDict.appTitle}</h1>
              <p className="text-[10px] text-emerald-200 uppercase tracking-wider">মোড: {authRole === 'salesman' ? 'সেলসম্যান' : authRole === 'company_admin' ? 'কোম্পানি অ্যাডমিন' : 'সুপার অ্যাডমিন'}</p>
            </div>
            <div className="flex gap-1 items-center">
              <select value={lang} onChange={(e) => setLang(e.target.value)} className="bg-emerald-900 text-white text-[10px] p-1 rounded font-bold outline-none">
                <option value="bn">বাংলা</option>
                <option value="en">English</option>
              </select>
              <select value={currency} onChange={handleCurrencyChange} className="bg-emerald-900 text-white text-[10px] p-1 rounded font-bold outline-none">
                <option value="BDT">BDT (৳)</option>
                <option value="USD">USD ($)</option>
              </select>
            </div>
          </header>

          {/* Secure Panel Switcher */}
          <div className="bg-slate-900 text-white px-3 py-1.5 flex justify-between items-center text-[11px]">
            <span>প্যানেল সুইচ:</span>
            <div className="flex gap-1">
              <button onClick={() => requestRoleSwitch('salesman')} className={`px-2.5 py-0.5 rounded ${authRole === 'salesman' ? 'bg-emerald-600 font-bold' : 'bg-slate-700'}`}>সেলসম্যান</button>
              <button onClick={() => requestRoleSwitch('company_admin')} className={`px-2.5 py-0.5 rounded ${authRole === 'company_admin' ? 'bg-emerald-600 font-bold' : 'bg-slate-700'}`}>কোম্পানি</button>
              <button onClick={() => requestRoleSwitch('super_admin')} className={`px-2.5 py-0.5 rounded ${authRole === 'super_admin' ? 'bg-emerald-600 font-bold' : 'bg-slate-700'}`}>সুপার</button>
            </div>
          </div>

          <main className="flex-1 p-3 overflow-y-auto space-y-3">
            {/* 1. SALESMAN PANEL */}
            {authRole === 'salesman' && (
              <>
                {activeTab === 'dashboard' && (
                  <div className="space-y-3">
                    <div className="grid grid-cols-2 gap-2">
                      <div className="bg-emerald-50 border border-emerald-200 p-2.5 rounded-xl">
                        <p className="text-[11px] text-emerald-700 font-bold">{currentLangDict.receivable}</p>
                        <p className="text-base font-bold text-emerald-900">{currencySymbol} {parties.reduce((acc, p) => acc + p.amount, 0)}</p>
                      </div>
                      <div className="bg-blue-50 border border-blue-200 p-2.5 rounded-xl">
                        <p className="text-[11px] text-blue-700 font-bold">{currentLangDict.totalStock}</p>
                        <p className="text-base font-bold text-blue-900">{items.reduce((acc, i) => acc + i.vanStock, 0)} পিস</p>
                      </div>
                    </div>
                    <div className="bg-gray-50 border p-3 rounded-xl space-y-2">
                      <h2 className="text-xs font-bold text-gray-700">রুট কাস্টমার লিস্ট</h2>
                      {parties.map(p => (
                        <div key={p.id} className="bg-white p-2 rounded border flex justify-between items-center text-xs">
                          <div>
                            <p className="font-bold">{p.name}</p>
                            <p className="text-[10px] text-gray-500">{p.phone} | {p.address}</p>
                          </div>
                          <span className="font-bold text-emerald-600">{currencySymbol} {p.amount}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === 'parties' && (
                  <div className="space-y-2">
                    <div className="flex justify-between items-center">
                      <h2 className="font-bold text-xs text-gray-800">পার্টি লেজার তালিকা</h2>
                      <button onClick={() => setShowPartyModal(true)} className="bg-emerald-600 text-white text-[11px] font-bold px-2.5 py-1.5 rounded-lg shadow">{currentLangDict.addParty}</button>
                    </div>
                    {parties.map(p => (
                      <div key={p.id} className="p-2.5 bg-gray-50 border rounded-xl flex justify-between items-center text-xs">
                        <div>
                          <p className="font-bold text-gray-900">{p.name}</p>
                          <p className="text-[10px] text-gray-500">ফোন: {p.phone}</p>
                        </div>
                        <span className="font-bold text-emerald-700">{currencySymbol} {p.amount}</span>
                      </div>
                    ))}
                  </div>
                )}

                {activeTab === 'items' && (
                  <div className="space-y-2">
                    <div className="flex justify-between items-center">
                      <h2 className="font-bold text-xs text-gray-800">ভ্যান ও গুডাউন স্টক তালিকা</h2>
                      <button onClick={() => setShowItemModal(true)} className="bg-emerald-600 text-white text-[11px] font-bold px-2.5 py-1.5 rounded-lg shadow">{currentLangDict.addItem}</button>
                    </div>
                    {items.map(item => (
                      <div key={item.id} className="p-2.5 bg-gray-50 border rounded-xl flex justify-between items-center text-xs">
                        <div>
                          <p className="font-bold text-gray-900">{item.name} ({item.unit})</p>
                          <p className="text-[10px] text-gray-500">মূল্য: {currencySymbol}{item.salePrice} | গুডাউন: {item.mainGodownStock}</p>
                        </div>
                        <span className="font-bold text-indigo-700">ভ্যান স্টক: {item.vanStock}</span>
                      </div>
                    ))}
                  </div>
                )}

                {activeTab === 'sales' && (
                  <div className="space-y-2.5 text-xs">
                    <h2 className="font-bold text-gray-800">সেলস ইনভয়েস ও থার্মাল মেমো</h2>
                    <select value={selectedPartyForSale} onChange={(e) => setSelectedPartyForSale(e.target.value)} className="w-full p-2 border rounded-xl bg-gray-50 text-xs font-bold">
                      <option value="">-- কাস্টমার বা পার্টি সিলেক্ট করুন --</option>
                      {parties.map(p => <option key={p.id} value={p.name}>{p.name} ({p.address})</option>)}
                    </select>

                    <div className="flex gap-1.5">
                      <select value={selectedItemId} onChange={(e) => setSelectedItemId(e.target.value)} className="flex-1 p-2 border rounded-xl bg-gray-50 text-xs">
                        <option value="">-- প্রোডাক্ট সিলেক্ট করুন --</option>
                        {items.map(i => <option key={i.id} value={i.id}>{i.name} (স্টক: {i.vanStock})</option>)}
                      </select>
                      <input type="number" min="1" value={itemQty} onChange={(e) => setItemQty(e.target.value)} className="w-14 p-2 border rounded-xl text-center" />
                      <button onClick={handleAddToCart} className="bg-emerald-600 text-white px-3 py-2 rounded-xl font-bold">যোগ</button>
                    </div>

                    <div className="border rounded-xl p-2.5 bg-gray-50 space-y-1.5">
                      <p className="font-bold text-gray-700 border-b pb-1">মেমো কার্ট ও হিসাব</p>
                      {salesCart.length === 0 ? <p className="text-[11px] text-gray-400 text-center py-2">কোনো প্রোডাক্ট যোগ করা হয়নি</p> : 
                        salesCart.map((c, i) => (
                          <div key={i} className="flex justify-between text-[11px] border-b border-dashed py-0.5">
                            <span>{c.name} x {c.qty} ({currencySymbol}{c.salePrice})</span>
                            <span className="font-bold">{currencySymbol} {c.salePrice * c.qty}</span>
                          </div>
                        ))
                      }

                      <div className="pt-2 space-y-1 border-t">
                        <div className="flex justify-between items-center text-[11px]">
                          <span>সাব-টোটাল:</span>
                          <span className="font-bold">{currencySymbol} {subTotalCalc}</span>
                        </div>
                        <div className="flex justify-between items-center text-[11px]">
                          <span>ডিসকাউন্ট / ছাড় (-):</span>
                          <input type="number" value={discountAmount} onChange={(e) => setDiscountAmount(e.target.value)} className="w-20 p-1 border rounded text-right" placeholder="0" />
                        </div>
                        <div className="flex justify-between items-center font-bold text-gray-900 border-t pt-1">
                          <span>সর্বমোট প্রদেয় (Grand Total):</span>
                          <span className="text-emerald-700">{currencySymbol} {grandTotalCalc}</span>
                        </div>
                        <div className="flex justify-between items-center text-[11px]">
                          <span>নগদ পরিশোধ (Paid):</span>
                          <input type="number" value={paidAmount} onChange={(e) => setPaidAmount(e.target.value)} className="w-20 p-1 border rounded text-right font-bold text-emerald-600" placeholder="0" />
                        </div>
                        <div className="flex justify-between items-center font-bold text-rose-700 pt-1">
                          <span>বর্তমান বকেয়া (Current Due):</span>
                          <span>{currencySymbol} {currentDueCalc}</span>
                        </div>
                      </div>
                    </div>

                    <div className="flex gap-2">
                      <select value={paymentType} onChange={(e) => setPaymentType(e.target.value)} className="w-1/2 p-2 border rounded-xl bg-gray-50 font-bold text-xs">
                        <option value="Cash">ক্যাশ পেমেন্ট (Cash)</option>
                        <option value="MobileBanking">মোবাইল ব্যাংকিং</option>
                        <option value="Credit">বাকি (Credit)</option>
                      </select>
                      <button onClick={() => { if(salesCart.length > 0) setShowPrintPreview(true); else alert('কার্ট খালি!'); }} className="w-1/2 bg-emerald-600 text-white font-bold py-2.5 rounded-xl shadow">
                        🖨️ মেমো প্রিন্ট
                      </button>
                    </div>
                  </div>
                )}
              </>
            )}

            {/* 2. COMPANY ADMIN PANEL */}
            {authRole === 'company_admin' && (
              <div className="space-y-3 text-xs relative">
                {isTrialExpired && (
                  <div className="absolute inset-0 bg-white/95 backdrop-blur-md z-40 flex flex-col items-center justify-center p-4 text-center space-y-3 rounded-2xl border shadow-xl">
                    <div className="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center text-xl font-bold">⚠️</div>
                    <h2 className="font-bold text-sm text-gray-900">ফ্রি ট্রায়ালের মেয়াদ শেষ!</h2>
                    <p className="text-[11px] text-gray-600 leading-relaxed">
                      আপনার ১৪ দিনের ফ্রি ট্রায়ালের মেয়াদ শেষ হয়ে গেছে। সফটওয়্যারটি নিরবচ্ছিন্নভাবে ব্যবহার চালিয়ে যেতে প্যাকেজ কিনুন।
                    </p>
                    <div className="w-full space-y-2 pt-2">
                      {packages.map(pkg => (
                        <div key={pkg.id} className="p-3 bg-emerald-50 border border-emerald-300 rounded-xl flex justify-between items-center text-left">
                          <div>
                            <p className="font-bold text-emerald-900">{pkg.name}</p>
                            <p className="text-[10px] text-emerald-700">মেয়াদ: {pkg.duration}</p>
                          </div>
                          <button onClick={() => { setSelectedPackageForBuy(pkg); setShowCheckoutModal(true); }} className="bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-bold text-[11px]">
                            কিনুন ({currencySymbol}{pkg.price})
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div className="bg-white p-3.5 rounded-xl border space-y-2 shadow-sm">
                  <div className="flex justify-between items-center">
                    <h2 className="font-bold text-gray-900 text-sm">🏢 কোম্পানি অ্যাডমিন প্যানেল</h2>
                    <button onClick={() => setIsTrialExpired(!isTrialExpired)} className="text-[10px] bg-rose-100 text-rose-700 px-2 py-1 rounded font-bold">
                      {isTrialExpired ? "ট্রায়াল আনলক করুন" : "ট্রায়াল এক্সপায়ার চেক"}
                    </button>
                  </div>
                  <p className="text-gray-500">আপনার সেলসম্যানদের রুট ও স্টক ম্যানেজ করুন।</p>
                </div>

                <div className="bg-white p-3 rounded-xl border space-y-2">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-gray-700">সেলসম্যান ও রুট ম্যানেজমেন্ট</h3>
                    <div className="flex gap-1">
                      <button onClick={() => setShowSalesmanModal(true)} className="bg-emerald-600 text-white px-2 py-1 rounded font-bold text-[10px]">+ সেলসম্যান</button>
                      <button onClick={() => setShowRouteModal(true)} className="bg-blue-600 text-white px-2 py-1 rounded font-bold text-[10px]">+ রুট</button>
                    </div>
                  </div>
                  {salesmen.map(sm => (
                    <div key={sm.id} className="p-2 bg-gray-50 rounded-lg border flex justify-between items-center">
                      <span className="font-bold">{sm.name} ({sm.assignedRoute})</span>
                      <span className="text-[10px] text-emerald-600 font-bold">{sm.status}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 3. SUPER ADMIN PANEL (WITH MASTER DEVICE TRACKING & BLOCK CONTROL) */}
            {authRole === 'super_admin' && (
              <div className="space-y-3 text-xs">
                <div className="bg-white p-3.5 rounded-xl border space-y-2 shadow-sm">
                  <div className="flex justify-between items-center">
                    <h2 className="font-bold text-gray-900 text-sm">👑 সুপার অ্যাডমিন প্যানেল (মাস্টার কন্ট্রোল)</h2>
                    <button onClick={() => setShowPkgModal(true)} className="bg-amber-600 text-white px-2.5 py-1.5 rounded-lg font-bold shadow">{currentLangDict.addPackage}</button>
                  </div>
                  <p className="text-gray-500">আপনার ক্লায়েন্ট কোম্পানিগুলোর লগইন ডিভাইস মনিটরিং এবং সিকিউরিটি ব্লক কন্ট্রোল।</p>
                </div>

                {/* --- SUPER ADMIN DEVICE MONITORING & BLOCK SECTION --- */}
                <div className="bg-indigo-50 border border-indigo-200 p-3 rounded-xl space-y-2">
                  <h3 className="font-bold text-indigo-900">🛡️ লাইভ ডিভাইস লগইন মনিটরিং (সুপার কন্ট্রোল)</h3>
                  <p className="text-[10px] text-indigo-700">কোন কোম্পানি কোন ডিভাইসে লগইন করে আছে তা দেখতে পাবেন এবং পাইরেসি রোধে যেকোনো ডিভাইস তাৎক্ষণিকভাবে ব্লক করতে পারবেন।</p>

                  <div className="space-y-2 pt-1">
                    {globalConnectedDevices.length === 0 ? <p className="text-gray-500 text-center py-2">কোনো ডিভাইস সংযুক্ত নেই</p> :
                      globalConnectedDevices.map(dev => (
                        <div key={dev.id} className="bg-white p-2.5 rounded-xl border flex justify-between items-center shadow-sm">
                          <div>
                            <p className="font-bold text-gray-900">{dev.companyName}</p>
                            <p className="text-[10px] text-gray-600">📧 {dev.email}</p>
                            <p className="text-[10px] text-indigo-700 font-bold">💻 {dev.deviceName} (IP: {dev.ip})</p>
                          </div>
                          <button onClick={() => superAdminTerminateDevice(dev.id)} className="bg-rose-600 text-white px-2.5 py-1.5 rounded-lg font-bold text-[10px] shadow">
                            🚫 ডিভাইস ব্লক
                          </button>
                        </div>
                      ))
                    }
                  </div>
                </div>

                <div className="space-y-2">
                  <h3 className="font-bold text-gray-700">সাবস্ক্রিপশন প্যাকেজ লিস্ট:</h3>
                  {packages.map(pkg => (
                    <div key={pkg.id} className="p-3 bg-white border rounded-xl flex justify-between items-center shadow-sm">
                      <div>
                        <p className="font-bold text-gray-900">{pkg.name}</p>
                        <p className="text-[10px] text-gray-500">মেয়াদ: {pkg.duration}</p>
                      </div>
                      <span className="font-bold text-amber-700">{currencySymbol} {pkg.price}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* Bottom Nav */}
          {authRole === 'salesman' && (
            <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t flex justify-around p-2 text-[10px] font-bold text-gray-600 shadow-lg">
              <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center ${activeTab === 'dashboard' ? 'text-emerald-700' : ''}`}>{currentLangDict.dashboard}</button>
              <button onClick={() => setActiveTab('parties')} className={`flex flex-col items-center ${activeTab === 'parties' ? 'text-emerald-700' : ''}`}>{currentLangDict.parties}</button>
              <button onClick={() => setActiveTab('items')} className={`flex flex-col items-center ${activeTab === 'items' ? 'text-emerald-700' : ''}`}>{currentLangDict.items}</button>
              <button onClick={() => setActiveTab('sales')} className={`flex flex-col items-center ${activeTab === 'sales' ? 'text-emerald-700' : ''}`}>{currentLangDict.sales}</button>
            </nav>
          )}

          {/* PIN Prompt Modal */}
          {showPinModal && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-5 max-w-xs w-full space-y-3 shadow-2xl text-xs">
                <div className="text-center space-y-1">
                  <h3 className="font-bold text-gray-900 text-sm">সিকিউরিটি পিন দিন</h3>
                  <p className="text-[11px] text-gray-500">কোম্পানি পিন: 2234 | সুপার পিন: 1123</p>
                </div>
                <input 
                  type="password" maxLength={4} value={pinInput} onChange={(e) => setPinInput(e.target.value)} placeholder="••••" 
                  className="w-full text-center text-xl py-2.5 border rounded-xl outline-none tracking-widest font-bold bg-gray-50" autoFocus
                />
                <div className="flex gap-2 pt-1">
                  <button onClick={() => setShowPinModal(false)} className="w-1/2 py-2.5 bg-gray-200 rounded-xl font-bold">বাতিল</button>
                  <button onClick={verifyPinAndSwitch} className="w-1/2 py-2.5 bg-emerald-600 text-white rounded-xl font-bold">প্রবেশ</button>
                </div>
              </div>
            </div>
          )}

          {/* Checkout Modal */}
          {showCheckoutModal && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-4 max-w-xs w-full space-y-3 shadow-2xl text-xs">
                <h3 className="font-bold text-sm text-center">অনলাইন পেমেন্ট গেটওয়ে</h3>
                <button onClick={() => { alert('পেমেন্ট সফল!'); setShowCheckoutModal(false); setIsTrialExpired(false); }} className="w-full py-2 bg-emerald-600 text-white rounded-xl font-bold">পেমেন্ট সম্পন্ন করুন</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
