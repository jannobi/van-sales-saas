name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Capacitor Project Non-Interactively
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Vyapar Van SaaS" "com.vyapar.vansaas" --web-dir . --inline
          npx cap add android --inline || true
          npx cap sync android

      - name: Build Release AAB Bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload Artifact AAB
        uses: actions/upload-artifact@v4
        with:
          name: play-store-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
